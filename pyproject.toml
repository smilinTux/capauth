[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "capauth"
dynamic = ["version"]
description = "Capability-based Authentication — decentralized, PGP-based identity and authorization"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "smilinTux", email = "admin@smilintux.org"},
]
keywords = ["authentication", "pgp", "decentralized", "identity", "capability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "PGPy>=0.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.25",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
skcapstone = [
    "skcapstone>=0.6.8",
]
gnupg = [
    "python-gnupg>=0.5",
]
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "PyJWT>=2.8",
    "python-gnupg>=0.5",
    "httpx>=0.25",
    "segno>=1.6",
    "pywebpush>=1.14",
    "webauthn>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "fastapi>=0.110",
    "python-gnupg>=0.5",
    "black>=24.0",
    "ruff>=0.3",
    "zeroconf>=0.38",
    "webauthn>=2.0",
    "soft-webauthn>=0.1",
    "pywebpush>=1.14",
]
all = [
    "capauth[gnupg,service,dev]",
]

[project.scripts]
capauth = "capauth.cli:main"
capauth-service = "capauth.service.server:main"

[project.urls]
Homepage = "https://capauth.io"
Documentation = "https://capauth.io"
Repository = "https://github.com/smilinTux/capauth"
Issues = "https://github.com/smilinTux/capauth/issues"
Changelog = "https://github.com/smilinTux/capauth/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capauth = ["SKILL.md"]

[tool.setuptools.exclude-package-data]
"capauth.service.oidc.static.bunker.lib" = ["*.js"]
"capauth.service.oidc.static.bunker.vendor" = ["*.js"]

[tool.setuptools.data-files]
"share/capauth/phone-signer" = [
    "phone-signer/app.js",
    "phone-signer/index.html",
    "phone-signer/manifest.webmanifest",
    "phone-signer/sw.js",
]
"share/capauth/phone-signer/icons" = ["phone-signer/icons/*.png"]
"share/capauth/phone-signer/lib" = ["phone-signer/lib/*.js"]
"share/capauth/phone-signer/vendor" = ["phone-signer/vendor/*.js"]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.setuptools_scm]
# The git tag IS the version. A push to the default branch cuts the next
# patch tag (see .github/workflows/publish.yml), so every release carries a
# genuinely new version instead of rebuilding 0.2.15 forever.
#
# These repos also carry NON-semver tags (swarm-20260717, fixwave-20260723,
# memory-index-fix-20260804, nextcloud-v0.3.0). setuptools-scm defaults to the
# newest tag of ANY shape, which derived a nonsense version like
# 20260805.dev25 for skcapstone. Both settings below restrict it to release
# tags only, matching the `--match 'v[0-9]*'` the tag job uses, so the two
# cannot disagree about which tag is current.
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
