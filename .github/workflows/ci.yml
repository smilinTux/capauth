name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,service]"
      # skcapstone is the OPTIONAL integration backbone, so it is deliberately
      # not a dependency (that would invert the direction: skcapstone depends on
      # capauth). But tests/test_integration.py exercises "integrated" mode and
      # assumed a dev venv where skcapstone happens to be installed, so in CI it
      # errored out with ModuleNotFoundError on 9 tests instead of testing
      # anything. Install it here, --no-deps so it cannot pull a PyPI capauth
      # over the checkout under test.
      # skcoord is listed second because skcapstone's coordination/itil/card_store
      # modules are now thin re-export shims over it (the CR-4.1 extraction), so
      # `import skcapstone` succeeds without it while
      # `from skcapstone.coordination import Board` does not. --no-deps means we
      # have to name it ourselves.
      # skcapstone requires Python 3.11+, capauth supports 3.10: on 3.10 the
      # integration tests skip (pytest.importorskip); on 3.11+ the import is
      # asserted here so those tests can never skip silently.
      - name: Install skcapstone (optional integration backbone) from source
        if: matrix.python-version != '3.10'
        run: |
          pip install --no-deps --no-cache-dir \
            "skcapstone @ git+https://github.com/smilinTux/skcapstone" \
            "skcoord @ git+https://github.com/smilinTux/skcoord"
          python -c "from skcapstone.scheduler_jobs import load_jobs_with_dropins"
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=capauth --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff re-reds this job every time upstream adds a
      # rule or changes formatting, with no commit from us in between. Bump it
      # deliberately, alongside the reformat it implies.
      - name: Install lint tools
        run: pip install "ruff==0.15.4"
      - name: Check formatting
        run: ruff format --check src/ tests/
      - name: Lint
        run: ruff check src/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Check dist
        run: |
          pip install twine
          twine check dist/*
