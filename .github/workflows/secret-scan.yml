name: secret-scan

# Fleet secret-scan gate: runs the gitleaks BINARY, not gitleaks-action.
#
# The action requires a paid license for ORGANIZATION-owned repos, and smilinTux
# is an org, so it exits with "missing gitleaks license" BEFORE scanning a single
# byte. skcomms carried exactly that gate for months: permanently red, therefore
# ignored, and scanning nothing at all. gitleaks itself is MIT and free; only the
# wrapper is licensed, so calling the binary restores real scanning at no cost
# with no org secret to provision.
#
# Pinned to an exact version so a new upstream rule cannot redden CI without a
# deliberate bump. --redact keeps a genuine finding out of public CI logs.
# --exit-code 1 fails the build on a finding.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the scan walks commits, not just the tree
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # Pull requests and pushes scan protected main plus only the commits in
      # the triggering change. This keeps an unrelated abandoned remote ref
      # from poisoning an otherwise clean change. Scheduled and manual runs
      # retain the all-ref safety scan.
      #
      # This repo had 14 findings already in its history when scanning was first
      # switched on. The baseline records those known findings by fingerprint.
      #
      # Shrinking the baseline is the cleanup task. NEVER regenerate it to make a
      # new finding disappear: that is how a real secret gets rubber-stamped.
      - name: Scan protected and event history
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git merge-base origin/main "$head")"
            fi
          fi
          scripts/gitleaks-scope.sh scoped origin/main "$base" "$head"

      - name: Scan all refs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: scripts/gitleaks-scope.sh full

      - name: Prove scoped and full scans can fail correctly
        run: scripts/gitleaks-scope.sh self-test
