name: Container image

# Publishes the CapAuth service image (the OIDC IdP and verify service) for a
# release tag as ghcr.io/smilintux/capauth:<version>, and records its digest.
# Consumers pin <version>@sha256:<digest> (SKStacks sksso.CAPAUTH_IMAGE refuses
# anything else). A published version is never overwritten.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build if its image is missing, e.g. v0.3.13"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/smilintux/capauth

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the version and refuse a tag that is not on main
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::not a release tag: $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release version: $version"; exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || {
            echo "::error::$TAG ($sha) is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Refuse to overwrite a published version
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.v.outputs.version }} already exists; versions are immutable"
            exit 1
          fi
      - name: Build
        run: |
          docker build \
            --build-arg CAPAUTH_VERSION="${{ steps.v.outputs.version }}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ steps.v.outputs.sha }}" \
            --label org.opencontainers.image.version="${{ steps.v.outputs.version }}" \
            -t "$IMAGE:${{ steps.v.outputs.version }}" .
      - name: Smoke test (version, service answers)
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          docker run --rm "$IMAGE:$v" capauth --version | tee /dev/stderr | grep -F "$v"
          docker run -d --name smoke -p 18420:8420 "$IMAGE:$v"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18420/capauth/v1/status >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18420/capauth/v1/status >/dev/null
          docker rm -f smoke
      - name: Push and record the digest
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          docker push "$IMAGE:$v"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$v")"
          echo "Pinned reference: \`$IMAGE:$v@${ref#*@}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "pinned: $IMAGE:$v@${ref#*@}"
