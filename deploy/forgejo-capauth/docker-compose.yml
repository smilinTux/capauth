# DEPRECATED (2026-09-26): this example builds and runs the standalone public
# CapAuth verification-service container. Chef decided 2026-09-26 that
# capauth runs on localhost as the existing loopback authz PDP (systemd
# --user unit, see SOP.md Scenario A); the standalone verification-service
# mode this example uses is deprecated. PGP passwordless login for apps is
# covered by ghcr.io/smilintux/authentik-capauth (an Authentik stage, via
# sksso) instead. Kept as-is; not removed, not changed in behavior.
#
# CapAuth + Forgejo: Passwordless PGP Login for Sovereign Git
#
# Quick start:
#   1. cp .env.example .env  and set STRONG unique secrets (see .env.example)
#   2. ./preflight.sh                  # refuses to run on default/empty secrets
#   3. Generate Forgejo config:  capauth setup forgejo --capauth-url http://capauth:8420
#   4. Copy the output to forgejo/conf/app.ini
#   5. docker compose up -d
#   6. Visit http://localhost:3000 and click "Sign in with CapAuth"
#
# For production, set proper secrets and use Traefik/nginx for TLS.
#
# SECURITY: CAPAUTH_ADMIN_TOKEN and CAPAUTH_JWT_SECRET are REQUIRED and have NO
# committed default. Compose hard-fails (via the ${VAR:?...} form below) if they
# are unset or empty; ./preflight.sh additionally rejects the placeholder
# defaults from .env.example. Never commit real secret values.

services:
  # ── CapAuth Verification Service ──────────────────────────────────
  capauth:
    image: ghcr.io/smilintux/capauth:latest
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "8420:8420"
    environment:
      CAPAUTH_SERVICE_ID: capauth.local
      CAPAUTH_BASE_URL: http://localhost:8420
      CAPAUTH_ADMIN_TOKEN: ${CAPAUTH_ADMIN_TOKEN:?set CAPAUTH_ADMIN_TOKEN in .env (see .env.example); run ./preflight.sh first}
      CAPAUTH_REQUIRE_APPROVAL: "false"
      CAPAUTH_DB_PATH: /data/keys.db
      CAPAUTH_JWT_SECRET: ${CAPAUTH_JWT_SECRET:?set CAPAUTH_JWT_SECRET in .env (see .env.example); run ./preflight.sh first}
    volumes:
      - capauth_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8420/capauth/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Forgejo (Sovereign Git) ───────────────────────────────────────
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    ports:
      - "3000:3000"
      - "222:22"
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/forgejo.db
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__SSH_PORT: 222
      # Enable OIDC
      FORGEJO__oauth2__ENABLE: "true"
    volumes:
      - forgejo_data:/data
      - ./forgejo/conf:/data/gitea/conf
    depends_on:
      capauth:
        condition: service_healthy
    restart: unless-stopped

volumes:
  capauth_data:
  forgejo_data:
